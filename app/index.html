<div class="shell">
  <header class="topbar" id="topbar" hidden>
    <div class="title" id="title"></div>
    <a class="tab-logo" href="#/home"><div class="wm"><span class="v">Vendita</span><span class="u">UNO</span></div></a>
    <div class="acts">
      <a href="#/live" aria-label="Live" id="liveDot"><svg class="i"><use href="#i-bell"/></svg></a>
      <a href="#/profilo" aria-label="Profilo"><svg class="i"><use href="#i-user"/></svg></a>
    </div>
  </header>

  <main id="view" class="view"><div class="loading"><div class="spin"></div></div></main>

  <div class="radial" id="radial">
    <div class="wrap">
      <a class="it lv" href="#/live"><svg class="i"><use href="#i-live"/></svg>Live</a>
      <a class="it" href="#/community?scrivi=1"><svg class="i"><use href="#i-pen"/></svg>Post</a>
      <a class="it" href="#/notizie"><svg class="i"><use href="#i-pin"/></svg>Notizie</a>
      <a class="it" href="#/guadagni"><svg class="i"><use href="#i-link"/></svg>Invita</a>
    </div>
  </div>

  <nav class="nav" id="nav" hidden>
    <div class="bar">
      <a href="#/home" data-nav="home"><svg class="i"><use href="#i-home"/></svg>Home</a>
      <a href="#/accademia" data-nav="accademia"><svg class="i"><use href="#i-cap"/></svg>Accademia</a>

  </nav>
</div>
