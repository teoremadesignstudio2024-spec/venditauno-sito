<title>Jarvis</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --bg: #04080d;
  --panel: #07111a;
  --line: #12324a;
  --ink: #bfefff;
  --dim: #5f8193;
  --cyan: #63e6ff;
  --amber: #ffd27a;
  --alert: #ff4d5e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: radial-gradient(ellipse at 50% 0%, #0a1822 0%, var(--bg) 60%);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, sans-serif;
  padding-block: 18px 28px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.clock { font: 500 34px/1 ui-monospace, Menlo, Consolas, monospace; color: var(--cyan); font-variant-numeric: tabular-nums; text-shadow: 0 0 14px rgba(99,230,255,.45); }
.clock small { display: block; font-size: 11px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; margin-top: 4px; }
h1 { margin: 0; font: 700 24px/1 "Orbitron", ui-monospace, monospace; letter-spacing: .3em; text-align: right; text-shadow: 0 0 18px rgba(99,230,255,.4); }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi strong { display: block; font: 700 clamp(20px, 4vw, 30px)/1.1 "Orbitron", ui-monospace, monospace; color: var(--amber); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.note { font-size: 12px; color: var(--dim); }
.orb-wrap { position: relative; }
canvas { display: block; width: 100%; height: clamp(230px, 40vh, 340px); }
.talk { display: grid; gap: 14px; justify-items: center; }
.mic {
  width: 112px; height: 112px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--cyan); color: #04080d; font: 600 13px/1.2 system-ui, sans-serif;
  box-shadow: 0 0 36px rgba(99,230,255,.35);
}
.mic.rec { background: var(--alert); color: #fff; box-shadow: 0 0 36px rgba(255,77,94,.5); }
.mic:disabled { opacity: .45; cursor: default; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 10px; width: 100%; align-items: end; }
textarea, input[type="password"] {
  width: 100%; background: #04080d; color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font: inherit; min-width: 0;
}
textarea { resize: vertical; min-height: 48px; }
button.btn {
  font: inherit; color: #04080d; background: var(--cyan); border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer;
}
button.btn:disabled { opacity: .45; cursor: default; }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; }
.err { color: var(--alert); font-size: 13px; min-height: 1em; text-align: center; }
audio { width: 100%; }
.memory textarea { min-height: 160px; font-size: 14px; }
.memory-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.saved { font-size: 12px; color: var(--dim); }
.gate { display: grid; gap: 10px; }
[hidden] { display: none !important; }
@media (max-width: 640px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  h1 { text-align: left; }
}
</style>

<div class="wrap">
  <header>
    <div class="clock" id="clock">--:--<small id="date">oggi</small></div>
    <h1>JARVIS</h1>
  </header>

  <section class="gate card" id="gate" hidden>
    <div class="label">Codice di accesso</div>
    <div class="row">
      <input type="password" id="code" autocomplete="off" placeholder="Inserisci il codice">
      <button class="btn" id="saveCode">Entra</button>
    </div>
  </section>

  <section class="card" id="panel" hidden>
    <div class="label">Pannello</div>
    <div class="kpis">
      <div class="kpi"><strong>—</strong><span>fatturato del mese</span></div>
      <div class="kpi"><strong>—</strong><span>lead</span></div>
      <div class="kpi"><strong>—</strong><span>chiusi</span></div>
      <div class="kpi"><strong>—</strong><span>venditori attivi</span></div>
    </div>
    <div class="note" style="margin-top:10px">I numeri compariranno quando colleghiamo il foglio KPI.</div>
  </section>

  <section class="orb-wrap" aria-hidden="true">
    <canvas id="orb"></canvas>
  </section>

  <section class="card talk" id="talk" hidden>
    <button class="mic" id="mic">Tocca per parlare</button>
    <div class="err" id="err" role="alert"></div>
    <div class="row">
      <textarea id="text" placeholder="Oppure scrivi qui"></textarea>
      <button class="btn" id="send">Invia</button>
    </div>
    <div id="result" style="width:100%" hidden>
      <div class="label">Tu</div>
      <div class="reply" id="said"></div>
      <div class="label" style="margin-top:12px">Jarvis</div>
      <div class="reply" id="reply"></div>
      <audio id="player" controls hidden></audio>
    </div>
  </section>

  <section class="card memory" id="memorySec" hidden>
    <div class="label">Memoria: clienti e regole di vendita</div>
    <textarea id="memory" placeholder="Scrivi qui chi sono i clienti, cosa hanno comprato, come trattarli, cosa dire e cosa evitare."></textarea>
    <div class="memory-bar">
      <span class="saved" id="saved"></span>
      <button class="btn" id="saveMemory">Salva memoria</button>
    </div>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var gate = $("gate"), panel = $("panel"), talk = $("talk"), memorySec = $("memorySec");
  var mic = $("mic"), sendBtn = $("send"), textBox = $("text"), errBox = $("err");
  var result = $("result"), said = $("said"), reply = $("reply"), player = $("player");
  var memoryBox = $("memory"), savedNote = $("saved");

  var history = [];
  var recorder = null, chunks = [], busy = false;

  function getCode() {
    try { return sessionStorage.getItem("jarvis_code") || ""; } catch (e) { return ""; }
  }
  function setCode(v) {
    try { sessionStorage.setItem("jarvis_code", v); } catch (e) {}
  }
  function clearCode() {
    try { sessionStorage.removeItem("jarvis_code"); } catch (e) {}
  }
  function showAll(on) {
    gate.hidden = on;
    panel.hidden = !on;
    talk.hidden = !on;
    memorySec.hidden = !on;
  }
  function setError(msg) { errBox.textContent = msg || ""; }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json", "X-Jarvis-Code": getCode() }, opts.headers || {});
    return fetch(path, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401) {
          clearCode();
          showAll(false);
          throw new Error("Codice non valido.");
        }
        if (!res.ok) throw new Error(data.error || "Errore del server.");
        return data;
      });
    });
  }

  // Entra: il codice si verifica caricando la memoria.
  $("saveCode").addEventListener("click", function () {
    var v = $("code").value.trim();
    if (!v) return;
    setCode(v);
    start();
  });

  function start() {
    api("/api/jarvis/memory").then(function (data) {
      memoryBox.value = data.memory || "";
      showAll(true);
      setError("");
    }).catch(function (err) {
      showAll(false);
      setError(err.message);
    });
  }

  $("saveMemory").addEventListener("click", function () {
    savedNote.textContent = "Salvataggio…";
    api("/api/jarvis/memory", { method: "POST", body: JSON.stringify({ memory: memoryBox.value }) })
      .then(function () { savedNote.textContent = "Memoria salvata."; })
      .catch(function (err) { savedNote.textContent = err.message; });
  });

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result).split(",")[1]); };
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }

  function send(payload) {
    if (busy) return;
    busy = true;
    setError("");
    mic.disabled = true;
    sendBtn.disabled = true;
    api("/api/jarvis/chat", { method: "POST", body: JSON.stringify(Object.assign({ history: history }, payload)) })
      .then(function (data) {
        said.textContent = data.transcript;
        reply.textContent = data.reply;
        result.hidden = false;
        history.push({ role: "user", content: data.transcript });
        history.push({ role: "assistant", content: data.reply });
        history = history.slice(-20);
        if (data.audio) {
          player.src = "data:audio/wav;base64," + data.audio;
          player.hidden = false;
          player.play().catch(function () {});
        } else {
          player.hidden = true;
        }
      })
      .catch(function (err) { setError(err.message || "Errore di rete."); })
      .then(function () {
        busy = false;
        mic.disabled = false;
        sendBtn.disabled = false;
      });
  }

  sendBtn.addEventListener("click", function () {
    var t = textBox.value.trim();
    if (!t) return;
    textBox.value = "";
    send({ text: t });
  });

  mic.addEventListener("click", function () {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
      mic.classList.remove("rec");
      mic.textContent = "Elaboro…";
      return;
    }
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setError("Questo browser non registra audio. Usa la casella di testo.");
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var type = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
      recorder = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
      chunks = [];
      recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        mic.textContent = "Tocca per parlare";
        var blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        blobToBase64(blob).then(function (audio) {
          send({ audio: audio, mimeType: blob.type.split(";")[0] });
        });
      };
      recorder.start();
      mic.classList.add("rec");
      mic.textContent = "Tocca per inviare";
    }).catch(function () {
      setError("Microfono non disponibile. Controlla il permesso del browser.");
    });
  });

  // Orologio.
  var days = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
  var months = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
  function tick() {
    var d = new Date();
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    $("clock").firstChild.nodeValue = pad(d.getHours()) + ":" + pad(d.getMinutes());
    $("date").textContent = days[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()];
  }
  tick();
  setInterval(tick, 10000);

  // Nuvola di particelle di sfondo.
  var canvas = $("orb"), ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function resize() {
    var rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function insideForm(x, y) {
    if (Math.abs(x) > 1 || Math.abs(y) > 0.62) return false;
    return Math.hypot(x + 1.08, y) > 0.5 && Math.hypot(x - 1.08, y) > 0.5;
  }
  function edgeness(x, y) {
    var d = Math.min(1 - Math.abs(x), 0.62 - Math.abs(y));
    return Math.max(0, 1 - d / 0.22);
  }
  var pts = [];
  var target = window.innerWidth < 600 ? 2000 : 3800;
  while (pts.length < target) {
    var px = Math.random() * 2 - 1, py = (Math.random() * 2 - 1) * 0.62;
    if (!insideForm(px, py)) continue;
    var e = edgeness(px, py);
    if (Math.random() > 0.3 + 0.7 * e) continue;
    pts.push({ x: px, y: py, z: (Math.random() - 0.5) * 0.28 + (1 - Math.abs(py)) * 0.12,
      s: 0.5 + Math.random() * 1.1, tw: Math.random() * Math.PI * 2, rim: e });
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    var cx = W / 2, cy = H * 0.5;
    var R = Math.min(W * 0.3, H * 0.42);
    var ang = reduce ? 0.35 : Math.sin(t * 0.00018) * 0.55;
    var cA = Math.cos(ang), sA = Math.sin(ang);
    var f = 2.6;
    function project(p) {
      var x = p.x, y = p.y, z = p.z;
      var xr = x * cA + z * sA, zr = -x * sA + z * cA;
      var k = f / (f + zr);
      return { x: cx + xr * R * k, y: cy + y * R * k, k: k };
    }
    for (var j = 0; j < pts.length; j++) {
      var q = pts[j], Q = project(q);
      var tw = 0.75 + 0.25 * Math.sin(t * 0.002 + q.tw);
      var alpha = (0.35 + 0.5 * q.rim) * Q.k * tw;
      ctx.fillStyle = q.rim > 0.5 ? "rgba(200,248,255," + Math.min(alpha * 1.2, 1) + ")" : "rgba(99,230,255," + alpha + ")";
      var r = q.s * Q.k;
      ctx.fillRect(Q.x, Q.y, r * 1.6, r * 1.6);
    }
    ctx.globalCompositeOperation = "source-over";
  }
  function frame(t) {
    draw(t);
    if (!reduce) requestAnimationFrame(frame);
  }
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);

  // Avvio: se c'è un codice salvato per la sessione, entra subito.
  if (getCode()) {
    start();
  } else {
    gate.hidden = false;
  }
})();
</script>
