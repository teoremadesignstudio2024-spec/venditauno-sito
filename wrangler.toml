name = "venditauno-sito"
main = "worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "ACADEMY_PROGRESS"
id = "16990aca669849f8905453df22aea689"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CrmStore"]

# Il gestionale CRM (clienti/onboarding/upsell) è stato tolto.
[[migrations]]
tag = "v2"
deleted_classes = ["CrmStore"]

# Archivio dei giorni della dashboard vendite (incassi e spesa ads): letture sempre aggiornate,
# con copia nel KV ACADEMY_PROGRESS. Senza questo binding la dashboard usa solo il KV.
[[durable_objects.bindings]]
name = "DASH"
class_name = "DashStore"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DashStore"]
